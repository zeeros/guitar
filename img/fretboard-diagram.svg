<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 10 460 310" width="100%" height="auto" font-family="Arial, sans-serif">
  <defs>
    <style>
      .fret-line { stroke: #aaa; stroke-width: 2.5; }
      .nut { stroke: #333; stroke-width: 3; }
      .string { stroke: #333; stroke-width: 2; }
      .wood-bg { fill: #f5e6c8; }
      .dot { fill: #a5573e; stroke: white; stroke-width: 1.5; }
      .dot-text { font-size: 10px; fill: white; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .interval-label { font-size: 12px; fill: #555; font-weight: bold; text-anchor: start; dominant-baseline: middle; }
      .string-highlight { fill: #a5573e; stroke: white; stroke-width: 1.5; }
      .string-highlight-text { font-size: 12px; fill: white; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .string-base-text { font-size: 12px; fill: #333; font-weight: bold; text-anchor: middle; dominant-baseline: central; }

      .fretboard { display: none; }
      .fretboard.active { display: block; }
      .highlights { display: none; }
      .highlights.active { display: block; }
      .pattern { display: none; }
      .pattern.active { display: block; }
    </style>
  </defs>


  <g id="fretboard-full" class="fretboard">
    <rect x="80" y="80" width="360" height="200" class="wood-bg" rx="2"/>
    <g stroke="#aaa" stroke-width="2.5">
      <line x1="80" y1="80" x2="80" y2="280" class="nut"/>
      <line x1="125" y1="80" x2="125" y2="280"/>
      <line x1="170" y1="80" x2="170" y2="280"/>
      <line x1="215" y1="80" x2="215" y2="280"/>
      <line x1="260" y1="80" x2="260" y2="280"/>
      <line x1="305" y1="80" x2="305" y2="280"/>
      <line x1="350" y1="80" x2="350" y2="280"/>
      <line x1="395" y1="80" x2="395" y2="280"/>
      <line x1="440" y1="80" x2="440" y2="280"/>
    </g>
    <g font-size="11" fill="#777" text-anchor="middle">
      <text x="102" y="305">1</text><text x="147" y="305">2</text><text x="192" y="305">3</text>
      <text x="237" y="305">4</text><text x="282" y="305">5</text><text x="327" y="305">6</text>
      <text x="372" y="305">7</text><text x="417" y="305">8</text>
    </g>
    <g stroke="#666" stroke-width="2">
      <line x1="80" y1="80" x2="440" y2="80"/>
      <line x1="80" y1="120" x2="440" y2="120"/>
      <line x1="80" y1="160" x2="440" y2="160"/>
      <line x1="80" y1="200" x2="440" y2="200"/>
      <line x1="80" y1="240" x2="440" y2="240"/>
      <line x1="80" y1="280" x2="440" y2="280"/>
    </g>
    <g class="string-base-text">
      <text x="45" y="84">E4</text>
      <text x="45" y="124">B3</text>
      <text x="45" y="164">G3</text>
      <text x="45" y="204">D3</text>
      <text x="45" y="244">A2</text>
      <text x="45" y="284">E2</text>
    </g>
    <g class="interval-label">
      <text x="455" y="100">P4</text><text x="455" y="140">M3</text>
      <text x="455" y="180">P4</text><text x="455" y="220">P4</text><text x="455" y="260">P4</text>
    </g>
  </g>

