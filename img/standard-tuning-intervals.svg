  <title
     id="title2">Standard guitar tuning</title>
  <desc
     id="desc4">Six guitar strings arranged horizontally from thickest (bottom) to thinnest (top), labeled with their open string notes: E, A, D, G, B, E. Text between each pair of strings describes the interval between them.</desc>
